# Tela de login (SDDM) em Wayland: mesmo tema eliasolie, sobre o weston em vez
# do Xorg. O weston do login fecha quando você entra no Hyprland (o Xorg ficava
# parado ocupando ~65 MB). Desfazer: bash system/boot-tweaks.sh --undo-sddm
[General]
DisplayServer=wayland

[Wayland]
CompositorCommand=weston --shell=kiosk --config=/etc/sddm-weston.ini
