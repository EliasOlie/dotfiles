# Bloqueio minimalista — paleta eliasolie
$void   = rgb(050505)
$line   = rgb(2a2a27)
$static = rgb(8a8a84)
$bone   = rgb(edede8)
$signal = rgb(c8f031)
$alert  = rgb(ff5a4e)

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/Imagens/Wallpapers/eliasolie-void.png
    color = $void
}

# Hora grande
label {
    monitor =
    # Archivo 62% de largura, peso 800 (via eixos da fonte variável)
    text = cmd[update:1000] echo "<span font_desc='Archivo @wdth=62,wght=800'>$(date +%H:%M)</span>"
    color = $bone
    font_size = 120
    font_family = Archivo
    position = 0, 160
    halign = center
    valign = center
}

# Data
label {
    monitor =
    text = cmd[update:60000] LC_TIME=pt_BR.UTF-8 date +"%A, %d de %B" | tr '[:lower:]' '[:upper:]'
    color = $static
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# Campo de senha: só uma linha, sem caixa
input-field {
    monitor =
    size = 320, 44
    outline_thickness = 0
    rounding = 0
    inner_color = $void
    outer_color = $void
    font_color = $bone
    font_family = JetBrainsMono Nerd Font
    check_color = $signal
    fail_color = $alert
    fail_text = SENHA INCORRETA
    capslock_color = $alert
    placeholder_text = <span foreground="##8a8a84">senha</span>
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

# Sublinhado lima do campo
shape {
    monitor =
    size = 320, 2
    color = $signal
    rounding = 0
    position = 0, -64
    halign = center
    valign = center
}

# Usuário
label {
    monitor =
    text = $USER
    color = $static
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}

# Tocando agora (some quando não há música)
label {
    monitor =
    text = cmd[update:3000] ~/.config/hypr/scripts/lock-status.sh music
    color = $bone
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -140
    halign = center
    valign = center
}

# Status: VPS e backup (mesma linha do rodapé do desktop)
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/lock-status.sh status
    color = $static
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = bottom
}

# Agenda: próximos eventos (mesmo arquivo do desktop, atualiza a cada minuto)
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/lock-status.sh agenda
    color = $bone
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    text_align = left
    position = -90, 0
    halign = right
    valign = center
}
