# mpv — identidade eliasolie (void, bone, lima)
# Janela limpa, sem interface: controles pelo teclado (espaço pausa, ←/→ 5 s,
# ↑/↓ 1 min, [ ] velocidade, f tela cheia, s print, q sai lembrando a posição).
# Tocar dentro do terminal kitty: mpvt <arquivo|url>  (função no .zshrc)

# vídeo pela GPU Intel (VA-API) quando der; cai no processador se não
hwdec=auto-safe
vo=gpu-next
background-color='#050505'

# comportamento
keep-open=yes
save-position-on-quit=yes
autofit-larger=80%x80%
cursor-autohide=800
screenshot-directory=~/Imagens/mpv
screenshot-template='%F-%P'

# textos na tela (OSD) e barra de progresso
osd-font='JetBrainsMono Nerd Font'
osd-font-size=26
osd-color='#EDEDE8'
osd-border-color='#050505'
osd-border-size=2
osd-shadow-offset=0
osd-bar-h=1.2
osd-bar-w=60
osd-bar-align-y=0.92
osd-duration=1200
osd-level=1

# legendas
sub-font='Archivo'
sub-font-size=40
sub-color='#EDEDE8'
sub-border-color='#050505'
sub-border-size=2.5
sub-auto=fuzzy
slang=pt-BR,pt,por,en,eng
alang=pt-BR,pt,por,ja,jpn,en,eng
